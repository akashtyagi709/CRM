spring.application.name=Backend
server.port=${PORT:8080}

# Database (DB_PASSWORD is required; set it as an environment variable)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CRM}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging (file and JSON appenders are defined in logback-spring.xml)
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=INFO

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

# CORS (comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT (JWT_SECRET is required; minimum 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=36000000